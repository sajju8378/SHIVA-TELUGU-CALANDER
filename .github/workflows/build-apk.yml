name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Dist to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r dist/* android/app/src/main/assets/web/
          # Copy root assets if any
          if [ -d "assets" ]; then
            cp -r assets android/app/src/main/assets/web/
          fi
          ls -la android/app/src/main/assets/web/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare Built APK Artifact
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Telugu-Panchangam-2027.apk
            mkdir -p downloads
            cp "$APK_PATH" downloads/telugu-panchangam-2027.apk
            mkdir -p docs/downloads
            cp "$APK_PATH" docs/downloads/telugu-panchangam-2027.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-Panchangam-2027-APK
          path: build-output/Telugu-Panchangam-2027.apk
          retention-days: 60

      - name: Commit Built APK to Repository for Website Download
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update built Android APK artifact [skip ci]"
          file_pattern: "downloads/*.apk docs/downloads/*.apk"
        continue-on-error: true
