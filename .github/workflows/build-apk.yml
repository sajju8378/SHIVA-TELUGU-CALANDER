name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect Built APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Successfully found built APK at: $APK_FILE"
            cp "$APK_FILE" build-output/Telugu-Panchangam-2027.apk
            ls -lh build-output/
          else
            echo "Error: APK was not produced in android/app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-Panchangam-2027-APK
          path: build-output/Telugu-Panchangam-2027.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-apk"
          name: "Telugu Panchangam 2027 Android APK"
          draft: false
          prerelease: false
          body: |
            ## 📱 Telugu Panchangam 2027 Android APK
            Official standalone Android package for Telugu Panchangam 2027.
          files: |
            build-output/Telugu-Panchangam-2027.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
