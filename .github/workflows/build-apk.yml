name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect Built APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          mkdir -p build-output
          cp "$APK_FILE" build-output/Telugu-Panchangam-2027.apk
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-Panchangam-2027-APK
          path: build-output/Telugu-Panchangam-2027.apk
          retention-days: 60
