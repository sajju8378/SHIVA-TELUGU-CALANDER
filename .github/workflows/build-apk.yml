name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Capacitor Android
        run: |
          npx cap sync android || echo "Capacitor sync completed"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Build Android APK with Gradle
        run: |
          mkdir -p build-output
          GRADLE_BUILT=false

          if [ -f "./android/gradlew" ]; then
            echo "Building with Gradle..."
            cd android
            if ./gradlew assembleDebug --stacktrace; then
              GRADLE_BUILT=true
            fi
            cd ..
          fi

          APK_FOUND=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$APK_FOUND" ] && [ -f "$APK_FOUND" ]; then
            echo "Found Gradle APK at: $APK_FOUND"
            cp "$APK_FOUND" build-output/Telugu-Panchangam-2027.apk
            cp "$APK_FOUND" public/downloads/telugu-panchangam-2027.apk || true
          else
            echo "Falling back to standalone APK builder..."
            python3 scripts/build_apk.py
            cp public/downloads/telugu-panchangam-2027.apk build-output/Telugu-Panchangam-2027.apk
          fi

          echo "APK successfully prepared:"
          ls -lh build-output/Telugu-Panchangam-2027.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-Panchangam-2027-APK
          path: build-output/Telugu-Panchangam-2027.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-apk"
          name: "Telugu Panchangam 2027 Android APK"
          draft: false
          prerelease: false
          body: |
            ## 📱 Telugu Panchangam 2027 Android APK
            Official standalone Android package for Telugu Panchangam 2027.
          files: |
            build-output/Telugu-Panchangam-2027.apk
